<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show/Hide Password</title>
    <!-- ==== Font Awesome CDN Link Start ==== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- ==== Font Awesome CDN Link End ==== -->
    <!-- ==== CSS Style Link Start ==== -->
     <link rel="stylesheet" href="./css/style.css">
    <!-- ==== CSS Style Link End ==== -->
</head>
<body>
    <div class="box">
        <input type="password" id="inputField" placeholder="Enter Password">
        <i class="fa-solid fa-eye" id="show"></i>
        <i class="fa-solid fa-eye-slash" id="hide"></i>
    </div>

    <script src="./js/script.js"></script>
</body>
</html>
